[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metvis3d-web"
version = "0.1.0"
description = "Biblioteca local de animaciones meteorológicas Visualizaciones 3D"
requires-python = ">=3.13"
dependencies = ["Flask==3.1.3", "gunicorn==27.0.1", "PyYAML==6.0.3"]

[tool.setuptools]
py-modules = ["application", "catalog", "publication", "operation"]
package-dir = {"" = "backend/src"}
