# Vocabulario canónico inspirado en la convención variable + nivel de g2ctl.
# El adaptador de cada modelo mapea sus mensajes GRIB a estos identificadores.
variables:
  ugrdprs:
    dimensions: [time, pressure, latitude, longitude]
    standard_name: eastward_wind
    units: m s-1
  vgrdprs:
    dimensions: [time, pressure, latitude, longitude]
    standard_name: northward_wind
    units: m s-1
  tmpprs:
    dimensions: [time, pressure, latitude, longitude]
    standard_name: air_temperature
    units: K
  rhprs:
    dimensions: [time, pressure, latitude, longitude]
    standard_name: relative_humidity
    units: '%'
  hgtprs:
    dimensions: [time, pressure, latitude, longitude]
    standard_name: geopotential_height
    units: m
  tmp2m:
    dimensions: [time, latitude, longitude]
    standard_name: air_temperature
    units: K
    height_m: 2
  ugrd10m:
    dimensions: [time, latitude, longitude]
    standard_name: eastward_wind
    units: m s-1
    height_m: 10
  vgrd10m:
    dimensions: [time, latitude, longitude]
    standard_name: northward_wind
    units: m s-1
    height_m: 10
  prmslmsl:
    dimensions: [time, latitude, longitude]
    standard_name: air_pressure_at_mean_sea_level
    units: Pa
  apcpsfc:
    dimensions: [time, latitude, longitude]
    standard_name: precipitation_amount
    units: kg m-2
