model:
  id: gfs
  center: ncep

source:
  directory_template: data/raw/GFS/{date}{cycle_hour}
  file_template: gfs.t{cycle_hour}z.pgrb2.0p25.f{forecast_hour:03d}
  forecast_schedule:
    - first_hour: 0
      last_hour: 384
      step_hours: 3

standardization:
  longitude_range: "0_360"

# Esta selección es inicial y se ampliará al definir los productos audiovisuales.
selected_variables:
  - ugrdprs
  - vgrdprs
  - vvelprs
  - tmpprs
  - rhprs
  - spfhprs
  - hgtprs
  - tmp2m
  - ugrd10m
  - vgrd10m
  - prmslmsl
  - pressfc
  - apcpsfc
