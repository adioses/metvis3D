model:
  id: GFS
  adapter: gfs
  source_pattern: null  # Definir en cada ejecución o en configuración local no versionada.

standardization:
  output_name: "GFS_{initialization:%Y%m%dT%H}.nc"
  longitude_range: "-180_180"
  pressure_units: Pa
  time_representation: valid_time_end
  expected_step_hours: 3

# Esta selección es inicial y se ampliará al definir los productos audiovisuales.
selected_variables:
  - ugrdprs
  - vgrdprs
  - tmpprs
  - rhprs
  - hgtprs
  - tmp2m
  - ugrd10m
  - vgrd10m
  - prmslmsl
  - apcpsfc
