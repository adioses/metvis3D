model:
  id: ECMWF
  adapter: ecmwf
  source_pattern: null  # Definir en cada ejecución o en configuración local no versionada.

standardization:
  output_name: "ECMWF_{initialization:%Y%m%dT%H}.nc"
  longitude_range: "-180_180"
  pressure_units: Pa
  time_representation: valid_time_end
  expected_step_hours: 3

selected_variables:
  - ugrdprs
  - vgrdprs
  - tmpprs
  - rhprs
  - hgtprs
  - tmp2m
  - ugrd10m
  - vgrd10m
  - prmslmsl
  - apcpsfc
