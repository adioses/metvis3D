# Configuración única del conversor GRIB2 a NetCDF.
# Se utiliza remapeos para valores parametros reservados para uso local de centros
# que no son ncep.
# Disciplinas trabajadas: 
# - 0: meteorológica 
# - 1: hidrológica
# - 2: superficie terrestre
# - 3: teledetección satelital
# - 4: meteorología espacial 
# - 10: océano
# No se procesan las disciplinas 20 ni 191 en este conversor inicial.

local_definitions_reserved: 
  disciplines: [0, 1, 2, 3, 4, 10]
  # En las disciplinas trabajadas, las categorías y los parámetros de estos
  # rangos se consideran reservados para uso local.
  category_range: [192, 254]
  parameter_range: [192, 254]

# Cada regla de remapeo exige: (name, units, long_name, factor, offset). 
# Una regla incompleta o que no pueda aplicarse detiene la conversión.
remappings:
  ncep: {}
  ecmwf:
    "0-6-192":
      name: TCDC
      units: "%"
      long_name: "Total cloud cover"
      factor: 100
      offset: 0
    "0-1-193":
      name: APCP
      units: mm
      long_name: "Total precipitation"
      factor: 1000
      offset: 0
